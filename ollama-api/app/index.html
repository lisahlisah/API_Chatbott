<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZF API Chatbot</title>
    <style>
        :root {
            --primary-color: #002e7a; /* ZF Blau-ähnlicher Ton */
            --secondary-color: #f4f4f9;
            --bot-msg-bg: #ffffff;
            --user-msg-bg: #002e7a;
            --text-color: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 1.5rem; }

        #chat-container {
            flex-grow: 1;
            max-width: 900px;
            margin: 20px auto;
            width: 95%;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
        }

        .user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot {
            align-self: flex-start;
            background-color: #f1f1f1;
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            border: 1px solid #e0e0e0;
        }

        /* Lade-Indikator (Thinking...) */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #f1f1f1;
            padding: 12px 16px;
            border-radius: 15px;
            border-bottom-left-radius: 2px;
        }

        .typing-dots { display: flex; gap: 4px; }
        .dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .input-area {
            display: flex;
            padding: 20px;
            gap: 10px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary-color); }

        button {
            padding: 0 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

    </style>
</head>
<body>
    <header>
        <h1>ZF API Chatbot</h1>
    </header>

    <div id="chat-container">
        <div id="messages">
            <div class="message bot">Willkommen beim ZF API Chatbot. Wie kann ich Ihnen heute helfen?</div>
        </div>
        
        <!-- Thinking Indicator -->
        <div id="typing" class="typing-indicator">
            <div class="typing-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Nachricht schreiben..." autocomplete="off">
            <button id="send-btn">Senden</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');
        const messagesDiv = document.getElementById('messages');
        const typingIndicator = document.getElementById('typing');

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // User Nachricht hinzufügen
            addMessage(text, 'user');
            input.value = '';
            
            // UI sperren & Loader zeigen
            toggleLoading(true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                
                // Bot Nachricht hinzufügen
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage('Fehler: Verbindung zur API fehlgeschlagen.', 'bot', true);
            } finally {
                toggleLoading(false);
            }
        }

        function addMessage(text, sender, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (isError) msgDiv.style.color = 'red';
            msgDiv.innerText = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function toggleLoading(isLoading) {
            input.disabled = isLoading;
            btn.disabled = isLoading;
            typingIndicator.style.display = isLoading ? 'block' : 'none';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (!isLoading) input.focus();
        }

        btn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
